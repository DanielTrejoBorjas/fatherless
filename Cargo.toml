[package]
name = "fatherless"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A std::process::Command alternative that spawns fully detached child processes in their own session"
readme = "README.md"
license = "BSD-3-Clause"
keywords = ["process", "command", "detach", "setsid", "spawn"]
categories = ["os::unix-apis"]
authors = ["DanielTrejoBorjas"]
repository = "https://github.com/DanielTrejoBorjas/fatherless"

[dependencies]
libc = "0.2.191"
